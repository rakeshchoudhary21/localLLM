<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakesh's Personal AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="stylesheets/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
</head>
<body>

<header id="top-bar">
    <a href="#" class="top-bar-brand" onclick="loadSession(0); return false;" title="Home"><span class="top-bar-brand-name">Rakesh's<span class="brand-exclamation">!</span></span><span class="top-bar-brand-tag">Personal AI</span></a>
    <div class="top-bar-actions">
        <button type="button" id="theme-toggle" class="theme-toggle" title="Switch to light mode" aria-label="Toggle theme">
            <span class="theme-icon theme-icon-sun" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            </span>
            <span class="theme-icon theme-icon-moon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </span>
        </button>
        <label for="model-select" class="top-bar-label">Engine</label>
        <select id="model-select" class="top-bar-select" title="AI model">
            <option value="gemma3:latest">Gemma 3 (Fast)</option>
            <option value="qwen2.5-coder:7b">Qwen 2.5-Coder (Coding)</option>
            <option value="deepseek-r1:14b">DeepSeek R1(Reasoning)</option>

        </select>
    </div>
</header>

<div class="app-layout">
<div id="sidebar">
    <div class="sidebar-brand">
        <span class="sidebar-brand-sub">Navigation</span>
    </div>

    <div class="sidebar-block sidebar-collapsible">
        <button type="button" class="sidebar-section-header" id="library-section-header" aria-expanded="true" aria-controls="library-body">
            <span class="sidebar-section-chevron" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </span>
            <span class="sidebar-section-icon sidebar-section-icon--folder" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
            </span>
            <span class="sidebar-section-title">Knowledge Library</span>
            <input type="file" id="file-upload" style="display:none" accept=".pdf" onchange="uploadBook(this)">
            <button type="button" class="sidebar-action-link sidebar-section-action" onclick="event.stopPropagation(); document.getElementById('file-upload').click()" title="Add PDF">Add PDF</button>
        </button>
        <div class="sidebar-section-body" id="library-body">
            <div id="library-list" class="library-list"></div>
        </div>
    </div>

    <hr class="sidebar-divider">

    <div class="sidebar-new-topic">
        <button type="button" class="sidebar-action-link new-topic-link" onclick="showTopicInput()">
            <span class="new-topic-icon" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </span>
            New topic
        </button>
    </div>
    <input type="text" id="inline-topic-input" class="sidebar-inline-input" style="display:none;" placeholder="Topic name..." onkeydown="if(event.key==='Enter') saveInlineTopic()">

    <div class="sidebar-topics-wrap">
        <div id="history-list"></div>
    </div>
</div>

<div id="app-container">
    <div id="chat-container"></div>
    <div class="input-wrapper">
        <div id="upload-progress-wrap" class="upload-progress-wrap" aria-live="polite" style="display: none;">
            <div class="upload-progress-bar-bg">
                <div id="upload-progress-bar" class="upload-progress-bar" style="width: 0%"></div>
            </div>
            <div id="upload-progress-label" class="upload-progress-label">Uploading…</div>
        </div>
        <input type="file" id="file-upload-chat" accept=".pdf" style="display:none" onchange="uploadBook(this)">
        <div class="input-row">
            <select id="book-select" class="input-book-select" title="Reference book for answers">
                <option value="">No book</option>
            </select>
            <div class="input-box">
                <button type="button" class="attach-btn attach-btn-chat" onclick="document.getElementById('file-upload-chat').click()" title="Upload PDF" aria-label="Upload PDF">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                </button>
                <textarea id="prompt" rows="1" placeholder="Ask Rakesh's AI anything..." oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
                <button type="button" id="send-btn" class="send-btn" onclick="sendQuery()" title="Send message" aria-label="Send message">
                    <svg class="send-btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>
            </div>
        </div>
    </div>
</div>
</div>

<script src="scripts/helper.js"></script>
</body>
</html>
